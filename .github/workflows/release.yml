# Pushing a tag like v0.1.0 builds the app, zips it and publishes a GitHub Release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the release

# Runs for the same tag wait for each other (a doubled tag push), so only one builds at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check the tag matches the app version
        run: |
          VERSION=$(awk '/MARKETING_VERSION:/ { print $2; exit }' app/project.yml)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $VERSION in app/project.yml"
            exit 1
          fi
      - name: Build and zip
        run: scripts/build-release.sh
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SHA=$(cat dist/Zephydian-$VERSION.zip.sha256)
          # A tag pushed twice starts two runs; the second finds the release made and stops here.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          # The notes are this version's CHANGELOG section (the app's "What's new" shows them), after
          # the SHA-256 line the app checks downloads against.
          NOTES=$(awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {f=1; next} f && /^## \[/ {exit} f {print}' CHANGELOG.md)
          printf 'SHA-256 of the zip: `%s`\n\n%s\n' "$SHA" "$NOTES" > release-notes.md
          gh release create "$GITHUB_REF_NAME" "dist/Zephydian-$VERSION.zip" \
            --title "Zephydian $VERSION" \
            --notes-file release-notes.md
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::The TAP_TOKEN secret isn't set, so the Homebrew tap wasn't updated."
            exit 0
          fi
          VERSION=${GITHUB_REF_NAME#v}
          SHA=$(cat dist/Zephydian-$VERSION.zip.sha256)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/ahmastan/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/zephydian.rb
          if git diff --quiet; then
            echo "The cask is already at $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "zephydian $VERSION"
          git push
