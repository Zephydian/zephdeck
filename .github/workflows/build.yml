# Builds the app (Release, as shipped) on every pull request and every push to main to catch breakage.
name: build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: cd app && xcodegen
      # Release (optimized, both architectures), as a release ships it: an optimizer-only compiler
      # crash once passed the Debug check and failed the v0.9.0 release.
      - name: Build Release (warnings count as errors)
        run: |
          xcodebuild -project app/Zephdeck.xcodeproj -scheme Zephdeck -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath app/build build SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
